name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build the app
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NoorMaktab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NoorMaktab-APK
          path: NoorMaktab.apk

      - name: Publish as a download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Noor Maktab (build ${{ github.run_number }})
          files: NoorMaktab.apk
