plugins {
    id 'com.android.application'
}

android {
    namespace 'com.noormaktab.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.noormaktab.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // keep recordings uncompressed so they load fast
    androidResources {
        noCompress 'mp3', 'm4a', 'ogg'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
